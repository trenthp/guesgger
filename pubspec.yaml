name: guesgger
description: A Frogger-style 3D runner game - navigate from the parking lot to the theme park entrance!
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/player/
    - assets/models/player/Textures/
    - assets/models/obstacles/
    - assets/models/obstacles/Textures/
    - assets/models/npcs/
    - assets/models/npcs/Textures/
    - assets/models/environment/
    - assets/models/environment/Textures/
    - assets/images/ui/
